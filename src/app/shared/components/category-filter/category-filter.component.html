<div class="category-filter">
    <button class="category-chip" [class.active]="selectedCategory === 'all'" (click)="selectCategory('all')">
        All Products
    </button>

    <button *ngFor="let category of categories" class="category-chip" [class.active]="selectedCategory === category"
        (click)="selectCategory(category)">
        {{ category | titlecase }}
    </button>
</div>
