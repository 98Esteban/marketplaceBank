<div class="product-grid" *ngIf="!loading; else loadingTemplate">
    <app-product-card *ngFor="let product of products; trackBy: trackByProductId" [product]="product"
        (addToCart)="onAddToCart($event)" (productClicked)="onProductClick($event)">
    </app-product-card>
</div>

<ng-template #loadingTemplate>
    <div class="loading-grid">
        <div class="product-skeleton" *ngFor="let item of [1,2,3,4,5,6,7,8]">
            <div class="skeleton-image"></div>
            <div class="skeleton-content">
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-line"></div>
            </div>
        </div>
    </div>
</ng-template>

<div class="empty-state" *ngIf="!loading && products.length === 0">
    <mat-icon class="empty-icon">inventory_2</mat-icon>
    <h3>No products found</h3>
    <p>Try adjusting your search or filters</p>
</div>
