<mat-toolbar color="primary" class="toolbar">
  <span class="store-title" routerLink="/">🛍️ Mi Tienda</span>

  <span class="spacer"></span>

  <button mat-icon-button class="cart-button" color="accent" [matBadge]="itemCount" [matBadgeHidden]="itemCount === 0"
    matBadgeColor="warn" (click)="goToCart()" aria-label="Carrito de compras">
    <mat-icon>shopping_cart</mat-icon>
  </button>
</mat-toolbar>
