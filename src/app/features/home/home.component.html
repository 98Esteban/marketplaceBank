<div class="home-container">
  <section class="hero-section">
    <div class="hero-content">
      <h1>Welcome to Bank Inc Marketplace</h1>
      <p>Discover amazing products at unbeatable prices</p>
    </div>
  </section>

  <section class="search-section">
    <app-search-bar (searchQuery)="onSearch($event)"></app-search-bar>
  </section>

  <section class="categories-section">
    <h2>Shop by Category</h2>
    <app-category-filter [categories]="categories" [selectedCategory]="selectedCategory"
      (categorySelected)="onCategoryFilter($event)">
    </app-category-filter>
  </section>

  <section class="products-section">
    <div class="section-header">
      <h2>All Products</h2>
      <span class="products-count">{{ products.length }} products found</span>
    </div>

    <app-product-grid [products]="filteredProducts" [loading]="loading" (addToCart)="onAddToCart($event)"
      (productClick)="onProductClick($event)">
    </app-product-grid>
  </section>
</div>
